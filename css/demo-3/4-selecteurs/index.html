<!doctype html>
<html lang="en">
  <head>

    <title>Document</title>

      p {
        color: blue;
        font-size: 18px;
      }
      #intro {
        color: darkgreen;
        font-weight: bold;
      }
      .important {
        color: red;

      }

    <p id="intro">Bienvenue!</p>
    <p class="important">Attention!</p>

  </body>
</html>
