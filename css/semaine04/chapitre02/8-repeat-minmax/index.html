<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><title>8 - Repeat et minmax</title>
  <style>
    body {
      font:
        18px Arial,
        sans-serif;
      margin: 40px;
    }
    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      grid-template-rows:
      gap: 15px;
    }
    .carte {
      background: #c8e6f5;
      padding: 25px;
    }
  </style>
  <h1>Une grille responsive sans breakpoint</h1>
  <p>
    Redimensionnez la fenêtre. <code>auto-fit</code> choisit le nombre de
    colonnes; <code>minmax</code> donne un minimum et permet aux cartes de
    grandir.
  </p>
  <div class="grille">
    <div class="carte">
      Carte 1 Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore,
      itaque velit.
    </div>
    <div class="carte">Carte 2</div>
    <div class="carte">Carte 3</div>
    <div class="carte">Carte 4</div>
    <div class="carte">Carte 5</div>
  </div>
</html>
