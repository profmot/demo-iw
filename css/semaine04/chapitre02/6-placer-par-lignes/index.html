<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><title>6 - Placer avec les lignes</title>
  <style>
    body {
      font:
        18px Arial,
        sans-serif;
      margin: 40px;
    }
    .grille {
      display: grid;
      grid-template-columns: repeat(4, 90px);
      grid-template-rows: repeat(3, 70px);
      gap: 8px;
      background: #eef7fc;
      padding: 10px;
      width: max-content;
    }
    .item {
      background: #c8e6f5;
      display: grid;
      place-items: center;
    }
    .grand {
      grid-column: 1 / 3;
      grid-row: 2 / 4;
      background: #19a833;
      color: white;
    }
  </style>
  <h1>Placer un item entre les lignes</h1>
  <p>
    Les nombres désignent les lignes, pas les cellules. L'item vert va de la
    ligne de colonne 1 à 3 et de la ligne de rangée 1 à 3.
  </p>
  <div class="grille">
    <div class="item grand">1 / 3<br />1 / 3</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
    <div class="item">G</div>
  </div>
</html>
