<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><title>1 - Pourquoi Grid?</title>
  <style>
    body {
      font:
        18px Arial,
        sans-serif;
      margin: 40px;
    }
    .page {
      display: grid;
      grid-template-columns: 160px 1fr;
      grid-template-rows: auto 180px auto;
      gap: 10px;
      max-width: 700px;
    }
    .page > * {
      background: #c8e6f5;
      padding: 15px;
    }
    header,
    footer {
      grid-column: 1 / 3;
    }
    main {
      background: #b9efc2 !important;
    }
  </style>
  <h1>Grid organise lignes et colonnes</h1>
  <p>
    La page possède deux colonnes et trois rangées. Le header et le footer
    couvrent les deux colonnes.
  </p>
  <div class="page">
    <header>En-tête</header>
    <nav>Navigation</nav>
    <main>Contenu principal</main>
    <footer>Pied de page</footer>
  </div>
</html>
