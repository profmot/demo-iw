<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><title>7 - Flex-direction</title>
  <style>
    body {
      font:
        18px Arial,
        sans-serif;
      margin: 40px;
    }
    .exemples {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    section {
      width: 250px;
    }
    .conteneur {
      display: flex;
      min-height: 170px;
      gap: 8px;
      border: 2px solid #003b7a;
      padding: 10px;
    }
    .conteneur span {
      background: #c8e6f5;
      padding: 12px;
      align-self: flex-start;
    }
    .row {
      flex-direction: row;
    }
    .row-reverse {
      flex-direction: row-reverse;
    }
    .column {
      flex-direction: column;
    }
    .column-reverse {
      flex-direction: column-reverse;
    }
  </style>
  <h1>Les quatre flex-direction</h1>
  <p>
    Les éléments HTML restent dans l'ordre 1, 2, 3; seul leur placement visuel
    change.
  </p>
  <div class="exemples">
    <section>
      <h2>row</h2>
      <div class="conteneur row">
        <span>1</span><span>2</span><span>3</span>
      </div>
    </section>
    <section>
      <h2>row-reverse</h2>
      <div class="conteneur row-reverse">
        <span>1</span><span>2</span><span>3</span>
      </div>
    </section>
    <section>
      <h2>column</h2>
      <div class="conteneur column">
        <span>1</span><span>2</span><span>3</span>
      </div>
    </section>
    <section>
      <h2>column-reverse</h2>
      <div class="conteneur column-reverse">
        <span>1</span><span>2</span><span>3</span>
      </div>
    </section>
  </div>
</html>
