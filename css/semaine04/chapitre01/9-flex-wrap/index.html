<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><title>9 - Flex-wrap</title>
  <style>
    body {
      font:
        18px Arial,
        sans-serif;
      margin: 40px;
    }
    .conteneur {
      display: flex;
      flex-wrap: wrap;
      align-content: space-between;
      gap: 10px;
      width: 360px;
      max-width: 100%;
      height: 320px;
      border: 2px solid #003b7a;
      padding: 10px;
    }
    .item {
      flex: 0 0 150px;
      padding: 15px;
      box-sizing: border-box;
      background: #c8e6f5;
    }
  </style>
  <h1>Retour à la ligne</h1>
  <p>
    Essayez <code>nowrap</code>, <code>wrap</code> et <code>wrap-reverse</code>.
    Puis retirez la hauteur du conteneur pour constater quand
    <code>align-content</code> cesse d'être visible.
  </p>
  <div class="conteneur">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
  </div>
</html>
