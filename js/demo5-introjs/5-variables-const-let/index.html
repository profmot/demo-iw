<html lang="fr">
  <head>

    <title>5 - Variables const et let</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Variables avec const et let</h1>
    <p>Joueur : <strong id="joueur"></strong></p>
    <p>Score : <span class="score" id="score">0</span></p>
    <button id="ajouter" type="button">Ajouter un point</button>
    <button id="reinitialiser" type="button">Réinitialiser</button>
    <p>Observez dans <code>script.js</code> pourquoi le nom utilise <code>const</code> et le score utilise <code>let</code>.</p>
