<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3 - Où placer le JavaScript?</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      console.log('1. Ce message vient d’une balise script dans le head.');
    </script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Trois emplacements possibles</h1>
    <section>
      <h2>Balise script</h2>
      <p>Ouvrez la console pour voir le message écrit dans le <code>head</code>.</p>
    </section>
    <section>
      <h2>Attribut d’événement</h2>
      <button type="button" onclick="alert('Ce code vient de onclick')">Tester onclick</button>
    </section>
    <section>
      <h2>Fichier externe</h2>
      <button id="externe" type="button">Tester script.js</button>
      <p id="sortie"></p>
    </section>
  </body>
</html>
