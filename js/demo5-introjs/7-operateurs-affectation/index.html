<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7 - Opérateurs et affectation</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Opérateurs et affectation</h1>
    <p>
      <input id="a" type="number" value="10" aria-label="Premier nombre" />
      <select id="operateur" aria-label="Opérateur">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
        <option value="%">%</option>
      </select>
      <input id="b" type="number" value="3" aria-label="Deuxième nombre" />
      <button id="calculer" type="button">Calculer</button>
    </p>
    <p id="resultat"></p>
    <p>Ouvrez aussi la console pour voir les affectations composées.</p>
  </body>
</html>
