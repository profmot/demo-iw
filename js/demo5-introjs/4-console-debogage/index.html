<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4 - Console et débogage</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Console et débogage</h1>
    <p>Ouvrez les outils de développement avec <strong>F12</strong>, puis choisissez l’onglet Console.</p>
    <button id="journal" type="button">console.log</button>
    <button id="avertissement" type="button">console.warn</button>
    <button id="erreur" type="button">Produire une erreur</button>
    <button id="pause" type="button">Tester debugger</button>
    <p>Repérez le type d’erreur, son message, le fichier <code>script.js</code> et le numéro de ligne.</p>
  </body>
</html>
