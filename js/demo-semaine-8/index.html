<!doctype html>
<html lang="en">

    <title>Document</title>

  <body>
    <div class="carte">
      <button>Action</button>
    </div>
    <section class="event-demo">
      <h2>Délégation d'événements</h2>
      <ul id="liste-demo">
        <li>Lire le DOM <button type="button">Supprimer</button></li>
        <li>Tester les événements <button type="button">Supprimer</button></li>
        <li>Préparer le TP2 <button type="button">Supprimer</button></li>
      </ul>
    </section>

    <script>
      const listed = document.querySelector('#liste-demo');

      listed.addEventListener('click', (event) => {
        if (event.target.matches('button')) {
          event.target.closest('li').remove();
        }
      });
      const liste = document.querySelector('#liste');

      liste.addEventListener('click', (event) => {
        if (event.target.matches('button')) {
          event.target.closest('li').remove();
        }
      });
    </script>
  </body>
