<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./script.js" type="module"></script>
  </head>
  <body>
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 50%;
        padding: 0.75rem;
      }
    </style>

    <h1>Inscription au cours</h1>

    <form id="formInscription">
      <label for="nom">Nom</label>
      <input id="nom" name="nom" type="text" minlength="2" required />

      <label for="courriel">Courriel</label>
      <input id="courriel" name="courriel" type="email" required />

      <label>
        <input name="infolettre" type="checkbox" />
        Je souhaite recevoir l'infolettre
      </label>

      <fieldset>
        <legend>Cours souhaités</legend>

        <label>
          <input name="cours" type="checkbox" value="interface-web" />
          Interface Web
        </label>

        <label>
          <input name="cours" type="checkbox" value="structures-donnees" />
          Structures de données
        </label>
      </fieldset>

      <div id="zoneHoraire" hidden>
        <label for="horaire">Horaire préféré</label>
        <select id="horaire" name="horaire" required disabled>
          <option value="">Choisir un horaire</option>
          <option value="jour">De jour</option>
          <option value="soir">De soir</option>
        </select>
      </div>

      <button id="btnSubmit" type="submit" disabled>S'inscrire</button>
    </form>

    <button id="btnExterne" type="button">Valider et envoyer</button>

    <p id="message"></p>
  </body>
</html>
