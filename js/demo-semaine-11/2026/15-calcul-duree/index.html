<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculer une durée</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Durée entre deux dates</h1>
      <form id="calcul">
        <label>Début <input id="debut" type="datetime-local" required /></label>
        <label>Fin <input id="fin" type="datetime-local" required /></label>
        <button>Calculer</button>
      </form>
      <p id="sortie" aria-live="polite"></p>
    </main>
  </body>
</html>
