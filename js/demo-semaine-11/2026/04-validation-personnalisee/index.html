<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validation personnalisée</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Message de validation personnalisé</h1>
      <form id="preferences">
        <label class="choix">
          <input id="infolettre" type="checkbox" />
          Je veux recevoir l'infolettre
        </label>
        <label for="courriel">Courriel</label>
        <input id="courriel" name="courriel" type="email" />
        <button>Enregistrer</button>
      </form>
      <p id="resultat" aria-live="polite"></p>
    </main>
  </body>
</html>
