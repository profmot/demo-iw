<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heure locale et UTC</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>La même date, deux affichages</h1>
      <button id="actualiser">Actualiser</button>
      <div class="comparaison">
        <section>
          <h2>Locale</h2>
          <p id="locale"></p>
        </section>
        <section>
          <h2>UTC</h2>
          <p id="utc"></p>
        </section>
      </div>
    </main>
  </body>
</html>
