<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>JavaScript-Débogage</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        display: flex;
        align-items: center;
        background: linear-gradient(to top left, #55691e, #b4c70b);
      }
      h1 {
        font-family: sans-serif;
        font-size: 50px;
        line-height: 1.3;
        width: 100%;
        padding: 10px;
        text-align: center;
        color: white;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      .hide {
        display: none;
      }
      .row {
        display: flex;
      }
      img {
        width: 300px;
        height: 200px;
        float: left;
      }
      .column {
        flex: 33.33%;
        padding: 5px;
      }
      .video-container {
        margin-top: 20px;
        width: 420px;
        height: 400px;
      }
      video {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="column">
        <img id="kitten3" src="./images/cat.jpg" alt="Cat" />
      </div>
      <div class="column">
        <img id="bark" src="./images/dog.jpg" alt="Dog" />
      </div>
      <div class="column">
        <img id="pig" src="./images/pig.jpg" alt="Pig" />
      </div>
      <audio id="audio">
        <source src="./audio/bark.wav" type="audio/wav" />
        <source src="./audio/bark.mp3" type="audio/mp3" />
        le navigateur ne supporte pas audio.
      </audio>
    </div>
    <div class="video-container">
      <video muted autoplay controls src="./video/video.mp4"></video>
    </div>
  </body>

  <script>
    let audio = document.querySelector('audio');
    let sources = document.querySelectorAll('source');

    window.addEventListener('click', function (e) {
      e.preventDefault();
      if (e.target.tagName === 'IMG') {
        sources.forEach(function (element) {
          if (element.getAttribute('type').includes('mp3')) {
            element.src = `./audio/${e.target.getAttribute('id')}.mp3`;
          } else {
            element.src = `./audio/${e.target.getAttribute('id')}.wav`;
          }
        });
        if (audio.paused) {
          audio.load();
          audio.play();
        } else audio.pause();
      }
    });
  </script>
</html>
