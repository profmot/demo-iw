<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau</title>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>nom</th>
          <th>programme</th>
          <th>da</th>

        <tr>
          <td colspan="2">Marc-Oivier</td>
          <td rowspan="2">202020</td>
        </tr>
        <tr>
          <td>Joe</td>
          <td>SH</td>
        </tr>
        <tr>
          <th scope="row">titre de rangee</th>
          <td>Joe</td>
          <td>SH</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>-</td>
          <td>-</td>
          <td>Total</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
